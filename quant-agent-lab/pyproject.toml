[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent-lab"
version = "0.1.0"
description = "Offline, approval-gated quantitative decision and paper trading MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.4",
  "mypy>=1.10",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
]
# 自动行情拉取（美股 yfinance / A股 akshare）——lazy import，未安装时 file 模式不受影响
live-data = [
  "yfinance>=0.2",
  "akshare>=1.14",
  "pandas>=2.0",
]
ml = [
  "torch>=2.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.2",
]

[project.scripts]
quant-agent = "quant_agent.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=var/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["quant_agent"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
