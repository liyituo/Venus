name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          pip install --quiet -r requirements.txt httpx python-xlib

      - name: 冒烟测试（daemon）
        run: xvfb-run -a python tests/smoke_test.py

      - name: 编程工具测试（检索/编辑/undo/git/进程/todo/超时）
        run: python tests/llm_tools_test.py

      - name: agent 循环端到端（ask+diff/todo/上下文上界）
        run: python tests/agent_loop_test.py

      - name: 会话持久化测试
        run: python tests/session_test.py

      - name: MCP 客户端测试（echo server 全链路）
        run: python tests/mcp_test.py

      - name: CLI 会话测试（摘要/懒加载/降级）
        run: python tests/cli_session_test.py

      - name: 推理强度测试（max/high/off 映射与持久化）
        run: python tests/reasoning_test.py

      - name: Skill 包与系统监控测试（扫描/加载/免确认/降级）
        run: python tests/skill_system_test.py

      - name: 子 agent 测试（delegate 委派/事件透传/深度限制/白名单/view_image）
        run: |
          python -X faulthandler -u tests/subagent_test.py 2>&1 | tee /tmp/subagent_out.txt
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "::error::subagent_test 失败，输出尾部："
            tail -60 /tmp/subagent_out.txt
            exit $EXIT
          fi

      - name: 工具路由测试（规则/解析/映射/缓存/降级/集成）
        run: python tests/tool_router_test.py
