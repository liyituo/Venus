name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows 是主要平台：完整测试套件（统一入口自动发现全部 tests/*_test.py）
  test-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（requirements-dev.txt 统一管理测试依赖）
        run: pip install --quiet -r requirements-dev.txt

      - name: 编译检查
        run: python -m compileall -q src tests

      - name: 依赖一致性检查
        run: python -m pip check

      - name: Ruff F/E9（未使用导入/语法级问题）
        run: python -m ruff check --select F,E9 src tests

      - name: 统一测试入口（自动发现全部 tests/*_test.py）
        run: python tests/run_all_tests.py

  # Ubuntu：隔离模式与跨平台模块（GUI 通过 mock，不操作真实鼠标键盘）
  test-ubuntu:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（requirements-dev.txt 统一管理测试依赖）
        run: pip install --quiet -r requirements-dev.txt

      - name: 编译检查
        run: python -m compileall -q src tests

      - name: Ruff F/E9
        run: python -m ruff check --select F,E9 src tests

      - name: 统一测试入口（Xvfb 虚拟显示，GUI 测试走 mock）
        run: xvfb-run -a python tests/run_all_tests.py

  # RAG 独立服务：分块/存储/向量检索/API（mock 模式，不依赖 Ollama；live 需本机 Ollama）
  test-rag:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（RAG/requirements.txt 管理）
        run: pip install --quiet -r RAG/requirements.txt ruff

      - name: 编译检查
        run: python -m compileall -q RAG

      - name: Ruff F/E9
        run: python -m ruff check --select F,E9 RAG

      - name: RAG 测试（mock 向量，无外部依赖）
        run: python RAG/tests/rag_test.py
